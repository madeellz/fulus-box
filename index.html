<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fulus Box</title>
  <meta name="description" content="Mohamed & Marmora's retro Alexandrian money diary.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#8E0B1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fulus Box">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Lalezar&family=Lobster&family=Monoton&family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ MONEY ICON SPRITE ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21zM9 8h6M9 12h6M9 16h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16V11M12 16V6M17 16v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v2.5"/><rect x="4" y="7.5" width="16" height="12" rx="2.5"/><path d="M20 11.5h-4a2 2 0 0 0 0 4h4"/></g><circle cx="16.2" cy="13.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-coin-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-note" viewBox="0 0 32 20"><rect x="1.5" y="1.5" width="29" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="10" r="1.3" fill="currentColor"/><circle cx="26" cy="10" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-piggy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M5 11.5C5 8 8.2 6 12 6c1.3 0 2.5.2 3.5.6L18 5v3c1 .8 1.6 1.7 1.9 2.7H21v3h-1.4c-.4.9-1.1 1.7-2 2.3V19h-2.6v-1.4c-.9.2-1.9.3-3 .3s-2-.1-2.9-.3V19H6.6v-2.4C5.6 15.4 5 13.8 5 11.5z"/><path d="M10 6.4V5h3"/><path d="M5 11H3.5"/></g><circle cx="15.5" cy="10.3" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19zM13.5 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<!-- ============ WELCOME / WHO ARE YOU ============ -->
<section id="welcome" class="welcome" aria-labelledby="welcomeTitle">
  <div class="sunburst" aria-hidden="true"></div>

  <div class="welcome-inner">
    <p class="est">★ EST. ALEXANDRIA 2026 ★</p>
    <h1 id="welcomeTitle" class="logo">
      <span class="logo-neon">FULUS</span>
      <span class="logo-script">Box</span>
    </h1>
    <p class="logo-ar" lang="ar" dir="rtl">صندوق الفلوس</p>
    <p class="tagline">Mohamed &amp; Marmora's money diary</p>

    <h2 class="who-q">WHO'S SPENDING TODAY?</h2>

    <div class="tickets">
      <button class="ticket" type="button" data-who="mohamed">
        <span class="ticket-emoji" aria-hidden="true">🧔🏻‍♂️</span>
        <span class="ticket-name">Mohamed</span>
        <span class="ticket-sub">El Basha · keeper of the wallet</span>
        <span class="ticket-stamp">ADMIT ONE</span>
      </button>
      <button class="ticket ticket--her" type="button" data-who="marwa">
        <span class="ticket-emoji" aria-hidden="true">👸🏻</span>
        <span class="ticket-name">Marmora</span>
        <span class="ticket-sub">El Hanem · minister of shopping</span>
        <span class="ticket-stamp">ADMIT ONE</span>
      </button>
    </div>

    <p class="welcome-joke" id="welcomeJoke"></p>
  </div>

  <!-- Alexandria skyline: Qaitbay citadel, retro striped sun, palm, sea -->
  <svg class="skyline" viewBox="0 0 375 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <clipPath id="sunClip"><circle cx="292" cy="78" r="44"/></clipPath>
    </defs>
    <g clip-path="url(#sunClip)">
      <rect x="240" y="30" width="110" height="100" fill="#F2A922"/>
      <rect x="240" y="80" width="110" height="5" fill="#C8102E"/>
      <rect x="240" y="92" width="110" height="7" fill="#C8102E"/>
      <rect x="240" y="106" width="110" height="9" fill="#C8102E"/>
    </g>
    <g fill="#2B0A0D">
      <!-- citadel walls -->
      <rect x="22" y="86" width="150" height="40"/>
      <rect x="62" y="58" width="70" height="68"/>
      <g>
        <rect x="22" y="80" width="8" height="8"/><rect x="38" y="80" width="8" height="8"/><rect x="146" y="80" width="8" height="8"/><rect x="162" y="80" width="10" height="8"/>
        <rect x="62" y="52" width="8" height="8"/><rect x="78" y="52" width="8" height="8"/><rect x="108" y="52" width="8" height="8"/><rect x="124" y="52" width="8" height="8"/>
      </g>
      <!-- corner towers -->
      <rect x="54" y="66" width="14" height="60" rx="3"/><rect x="126" y="66" width="14" height="60" rx="3"/>
      <!-- minaret -->
      <rect x="93" y="22" width="9" height="36"/>
      <rect x="90" y="34" width="15" height="3"/>
      <path d="M93 22a4.5 6 0 0 1 9 0z"/>
      <rect x="97" y="10" width="1.4" height="8"/>
      <!-- palm -->
      <path d="M206 126c2-16 3-30 1-44h3c2 14 1 28-1 44z"/>
      <path d="M208.5 82c-8-6-18-6-26-1 9-2 17 0 24 4zM208.5 82c6-8 16-10 25-7-9 0-17 3-23 9zM208.5 82c-2-9-9-15-18-16 7 3 12 9 15 17zM208.5 82c4-8 11-12 19-12-7 3-13 8-16 14z"/>
    </g>
    <!-- windows -->
    <g fill="#F2A922"><rect x="94" y="78" width="6" height="10" rx="3"/><rect x="80" y="96" width="5" height="8" rx="2.5"/><rect x="110" y="96" width="5" height="8" rx="2.5"/></g>
    <!-- seagulls -->
    <g fill="none" stroke="#2B0A0D" stroke-width="1.6" stroke-linecap="round"><path d="M180 40q4-4 8 0q4-4 8 0"/><path d="M226 26q3-3 6 0q3-3 6 0"/></g>
    <!-- sea -->
    <path d="M0 120q12-8 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0V150H0z" fill="#1F8A8A"/>
    <path d="M0 132q12-7 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0V150H0z" fill="#FFF3DC"/>
  </svg>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-logo"><span class="tb-script">Fulus</span><span class="tb-pixel">BOX</span></div>
    <button class="who-chip" id="whoChip" type="button" aria-label="Switch person">
      <span id="whoChipEmoji"></span><span id="whoChipName"></span>
      <svg class="ic-sm"><use href="#i-swap"/></svg>
    </button>
  </header>

  <main id="views">
    <!-- HOME -->
    <section class="view" id="v-home" data-view="home"></section>

    <!-- ADD -->
    <section class="view" id="v-add" data-view="add" hidden>
      <h2 class="sec-title" id="addTitle">New expense</h2>
      <form id="addForm" class="card form" autocomplete="off" novalidate>
        <label class="lbl" for="fAmount">HOW MUCH?</label>
        <div class="amount-wrap">
          <input id="fAmount" class="amount-input" type="text" inputmode="decimal" placeholder="0" aria-label="Amount in Egyptian pounds">
          <span class="amount-cur">EGP</span>
        </div>
        <div class="quick-amts" id="quickAmts"></div>

        <label class="lbl" for="fWhen">WHEN?</label>
        <div class="when-row">
          <input id="fWhen" class="input" type="datetime-local" min="2026-10-01T00:00">
        </div>
        <div class="chip-row" id="whenChips">
          <button type="button" class="chip" data-when="now">⏱ Now</button>
          <button type="button" class="chip" data-when="yday">🌙 Yesterday</button>
          <button type="button" class="chip" data-when="yday2">📅 2 days ago</button>
        </div>

        <label class="lbl">CATEGORY <span class="lbl-hint" id="catMonthHint"></span></label>
        <div class="cat-grid" id="catGrid" role="radiogroup" aria-label="Category"></div>

        <label class="lbl">PAID WITH</label>
        <div class="chip-row" id="payChips" role="radiogroup" aria-label="Payment method"></div>

        <label class="lbl" for="fNote">NOTE <span class="lbl-hint">(optional)</span></label>
        <input id="fNote" class="input" type="text" maxlength="80" placeholder="e.g. Kadoura fish with the family 🐟">

        <p class="form-error" id="formError" role="alert"></p>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Cancel</button>
          <button type="submit" class="btn btn-big" id="saveBtn">💸 Save it</button>
        </div>
      </form>
    </section>

    <!-- HISTORY -->
    <section class="view" id="v-history" data-view="history" hidden></section>

    <!-- ANALYSIS -->
    <section class="view" id="v-stats" data-view="stats" hidden></section>

    <!-- MORE -->
    <section class="view" id="v-more" data-view="more" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-go="home" type="button"><svg><use href="#i-home"/></svg><span>Home</span></button>
    <button class="tab" data-go="history" type="button"><svg><use href="#i-receipt"/></svg><span>History</span></button>
    <button class="tab tab-add" data-go="add" type="button" aria-label="Add expense"><span class="add-coin"><svg><use href="#i-coin-plus"/></svg></span></button>
    <button class="tab" data-go="stats" type="button"><svg><use href="#i-chart"/></svg><span>Analysis</span></button>
    <button class="tab" data-go="more" type="button"><svg><use href="#i-wallet"/></svg><span>More</span></button>
  </nav>
</div>

<!-- Bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="coin-rain" id="coinRain" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
